# 塔克无线高速 DAP (DAPLINK-WIRELESS) —— Car_F429 / STM32F429VETx
# 供 VSCode Cortex-Debug 调用，也可命令行直接用：
#
#   openocd -f .vscode/openocd-daplink.cfg -c "program build/Debug/Car_F429.elf verify reset exit"

# ---- 调试器：CMSIS-DAP ----
# DAPLink 无论有线还是无线模式，对外都是 CMSIS-DAP 协议，用同一个驱动。
adapter driver cmsis-dap
transport select swd

# ---- 目标芯片 ----
source [find target/stm32f4x.cfg]

# ---- SWD 时钟：无线链路固定 100 kHz ----
# 坑：上面的 stm32f4x.cfg 里自带一行 `adapter speed 2000`，
# 并且注册了 reset-start(=2000) / reset-init(=8000) 两个事件会再次提速。
# 所以这里必须在 source 之后重新设一次，并把那两个事件覆盖掉，否则复位后会被改回去。
adapter speed 100
stm32f4x.cpu configure -event reset-start { adapter speed 100 }
stm32f4x.cpu configure -event reset-init  { adapter speed 100 }

# ---- 若无线模式连不上，逐个尝试下面几项 ----
#
# 1) DAP 固件分 v1(HID) 和 v2(WinUSB bulk) 两种后端，默认 auto 自动挑；
#    挑错时可强制指定（注意 0.12.0 里旧写法 cmsis_dap_backend 已弃用）：
#       cmsis-dap backend hid        ; v1，免装驱动
#       cmsis-dap backend usb_bulk   ; v2，需要给设备装 WinUSB 驱动(Zadig)
#
# 2) 无线 DAP 若没把 nRST 引到目标板，硬复位会失败，改成不要求硬复位：
#       reset_config none
#
# 3) 目标板上电顺序/复位电路特殊时，可试：
#       reset_config srst_only srst_nogate
